name: Automatic Airbus Test Flights Update

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-flights
  cancel-in-progress: false
  # Don't cancel a run that's mid-fetch (would waste API calls and could
  # leave the store half-written); just let any queued run wait instead.

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
      OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compute yesterday's UTC date
        id: date
        run: |
          echo "value=$(date -u -d 'yesterday' +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      # Registration matching (F-W..., D-AV/D-AX/D-AZ...) needs OpenSky's
      # aircraft database. Without it only callsigns can be matched, which
      # misses Hamburg-Finkenwerder test/delivery flights that fly without an
      # AIB callsign. Cached per month; if the download fails the run
      # carries on with callsign-only matching rather than failing.
      - name: Cache OpenSky aircraft database
        id: registry-cache
        uses: actions/cache@v4
        with:
          path: aircraftDatabase.csv
          key: opensky-aircraft-db-${{ steps.date.outputs.month }}
          restore-keys: |
            opensky-aircraft-db-

      - name: Download OpenSky aircraft database
        if: steps.registry-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          # Only on a cache miss (about once a month). Written to a temp file
          # first, so a failed download leaves any older cached copy intact.
          curl -fL --retry 3 --retry-delay 5 -o aircraftDatabase.csv.tmp \
            https://s3.opensky-network.org/data-samples/metadata/aircraftDatabase.csv
          mv aircraftDatabase.csv.tmp aircraftDatabase.csv
          wc -l aircraftDatabase.csv

      - name: Pick registry option
        id: regopt
        run: |
          if [ -s aircraftDatabase.csv ]; then
            echo "args=--registry aircraftDatabase.csv" >> "$GITHUB_OUTPUT"
          else
            echo "WARNING: no aircraft database available; matching on callsigns only."
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      # Finish earlier dates that are incomplete (rate limit OR transient
      # errors) and re-query dates whose airport list was taken before
      # OpenSky's data had settled. At most 2 dates per run so that
      # yesterday's fetch below still has credits left.
      - name: Revisit unfinished / unsettled dates
        run: |
          python3 fetch_day.py --revisit --revisit-limit 2 \
            -o data/store.json --keep-days 14 ${{ steps.regopt.outputs.args }}

      - name: Fetch yesterday and prune to a 14-day window
        run: |
          python3 fetch_day.py "${{ steps.date.outputs.value }}" \
            -o data/store.json \
            --keep-days 14 ${{ steps.regopt.outputs.args }}

      - name: Build the embeddable fragment
        run: |
          python3 build/make_fragment.py data/store.json \
            -o fragment.html \
            --widget-id airbus-test-flights

      - name: Sanity-check the result before committing
        env:
          FETCHED_DATE: ${{ steps.date.outputs.value }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          fetched_date = os.environ["FETCHED_DATE"]
          with open("data/store.json") as f:
              store = json.load(f)
          days = store.get("days", {})
          total_trips = sum(len(d.get("trips", [])) for d in days.values())
          unfinished = sorted(
              date for date, entry in days.items()
              if not entry.get("meta", {}).get("complete", True)
          )
          print(f"Store has {len(days)} date(s), {total_trips} trip(s) total.")
          print(f"This run fetched: {fetched_date}")
          if unfinished:
              print(
                  f"NOTE: {len(unfinished)} date(s) are not yet complete "
                  f"({', '.join(unfinished)}) -- rate limit or transient API "
                  "errors. This does not block committing; the next run's "
                  "revisit step keeps filling them in while they stay inside "
                  "the 14-day window."
              )
          if len(days) == 0:
              sys.exit("Store is empty -- refusing to commit.")
          if fetched_date not in days:
              sys.exit(f"{fetched_date} is missing from the store -- refusing to commit.")
          if total_trips == 0:
              total_candidates = sum(
                  len(d.get("meta", {}).get("candidates") or [])
                  for d in days.values()
              )
              if fetched_date in unfinished and total_candidates == 0:
                  sys.exit(
                      f"{fetched_date} could not be queried (credit limit) and "
                      "the store has zero trips -- can't tell a quiet stretch "
                      "from an exhausted account. Refusing to commit; try "
                      "again after credits reset."
                  )
              if total_candidates:
                  sys.exit(
                      f"{total_candidates} candidate flight(s) matched but none "
                      "produced a track -- likely a track-fetch problem. "
                      "Refusing to commit; check the fetch step's logs."
                  )
              print("No matching flights in any stored date -- treating as a "
                    "genuinely quiet stretch and committing.")
          PY

      - name: Commit updated data and fragment
        env:
          FETCHED_DATE: ${{ steps.date.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/store.json fragment.html
          if git diff --cached --quiet; then
            echo "No changes (store and fragment already up to date)."
          else
            git commit -m "Add ${FETCHED_DATE} to Airbus Flights Data"
            git push
          fi

      - name: Push fragment to clintjb.github.io
        env:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${PERSONAL_ACCESS_TOKEN}@github.com/clintjb/clintjb.github.io.git" target_repo

          mkdir -p target_repo/_includes
          cp fragment.html target_repo/_includes/airbus_test_flights.html

          cd target_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _includes/airbus_test_flights.html

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Airbus Test / Beluga Flights"
            git push
          fi
